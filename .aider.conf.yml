# beehiiv-react — Aider configuration
# This tells Aider which files to always read for project context.

read:
  - SKILL.md
  - CLAUDE.md
  - src/index.ts
  - src/types/index.ts
  - src/client/index.ts
  - src/hooks/index.ts
  - src/components/index.ts

# Always lint and typecheck after edits
lint-cmd: "npm run lint"
test-cmd: "npm test"

# Use conventional commit messages
commit: true
